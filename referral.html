<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feldo - Referral Program</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #2a1b4e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-purple: #7c3aed;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 16px;
            display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 480px; box-sizing: border-box; padding-bottom: 120px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .header h3 { margin: 0; color: #fff; background: linear-gradient(135deg, #c084fc, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .banner-card {
            background: linear-gradient(135deg, #ec4899, #7c3aed);
            border-radius: 18px; padding: 16px; color: #fff; text-align: center; margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.35);
        }
        .banner-card h2 { margin: 0 0 6px 0; font-size: 20px; }
        .banner-card p { margin: 0; font-size: 12px; opacity: 0.95; }

        .card { background: var(--card-bg); border: 1px solid #3a2b5e; border-radius: 18px; padding: 16px; margin-bottom: 16px; }
        .card h4 { margin: 0 0 10px 0; font-size: 14px; color: #fbbf24; display: flex; align-items: center; gap: 8px; }

        .ref-box {
            background: #0b0f19; border: 1px solid var(--card-border); padding: 10px 14px;
            border-radius: 10px; display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; color: #38bdf8; word-break: break-all; margin-bottom: 10px;
        }
        .copy-btn {
            background: #7c3aed; color: #fff; border: none; padding: 8px 12px; border-radius: 8px;
            cursor: pointer; font-size: 11px; font-weight: bold; flex-shrink: 0; margin-left: 8px;
        }
        .copy-btn:active { transform: scale(0.95); }

        .item-box {
            background: #0b0f19; border: 1px solid var(--card-border);
            padding: 10px 12px; border-radius: 10px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center; font-size: 12px;
        }

        .bottom-color-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: var(--card-bg);
            border-top: 1px solid var(--card-border); display: flex; gap: 12px;
            padding: 14px 16px 18px 16px; box-sizing: border-box; z-index: 9999;
        }
        .color-nav-btn {
            flex: 1; text-align: center; text-decoration: none; color: #fff;
            font-size: 13px; font-weight: 700; padding: 12px 0; border-radius: 14px;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .color-nav-btn i { font-size: 18px; }
        .color-nav-btn.home-btn { background: linear-gradient(135deg, #f59e0b, #ec4899); }
        .color-nav-btn.profile-btn { background: linear-gradient(135deg, #7c3aed, #4c1d95); }
        .color-nav-btn:active { transform: scale(0.94); filter: brightness(1.25); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h3><i class="fa-solid fa-users" style="color: #f59e0b;"></i> Referral Program</h3>
        </div>

        <div class="banner-card">
            <h2>Invite & Earn</h2>
            <p>Share your referral link with friends and earn bonus gold when they join!</p>
        </div>

        <div class="card">
            <h4><i class="fa-solid fa-link"></i> Your Referral Link</h4>
            <div class="ref-box">
                <span id="refLinkText">Loading link...</span>
                <button class="copy-btn" onclick="copyRefLink()">Copy Link</button>
            </div>
            <div style="font-size: 11px; color: var(--text-muted); text-align: center;">
                Total Referrals: <b id="totalRefCnt" style="color: #fbbf24;">0</b>
            </div>
        </div>

        <div class="card">
            <h4><i class="fa-solid fa-list-check"></i> Referred Users List</h4>
            <div id="referredListContainer" style="max-height: 220px; overflow-y: auto;">
                <small style="color: var(--text-muted);">No referred users yet.</small>
            </div>
        </div>

    </div>

    <div class="bottom-color-nav">
        <a class="color-nav-btn home-btn" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="color-nav-btn profile-btn" href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDhfJ5kaWCbTpCbZKrmVpzROQia9XIdhhc",
            authDomain: "feldo-e6bdd.firebaseapp.com",
            databaseURL: "https://feldo-e6bdd-default-rtdb.firebaseio.com",
            projectId: "feldo-e6bdd",
            storageBucket: "feldo-e6bdd.firebasestorage.app",
            messagingSenderId: "880628628032",
            appId: "1:880628628032:web:771cdd8dea5c4ebae9fda5",
            measurementId: "G-EHNFBDCDZ4"
        };
        firebase.initializeApp(firebaseConfig);
        firebase.analytics();
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id.toString() : "7757851056";

        // রেফারেল লিংক তৈরি (বট বা ওয়েবসাইটের স্টার্টিং লিংক + startapp প্যারামিটার)
        let botUsername = "heyfobot"; // আপনার টেলিগ্রাম বট ইউজারনেম
        let refLink = `https://t.me/${botUsername}?start=ref_${userId}`;
        document.getElementById('refLinkText').innerText = refLink;

        function copyRefLink() {
            navigator.clipboard.writeText(refLink).then(() => {
                tg.showAlert("📋 Referral link copied to clipboard!");
            });
        }

        // ফায়ারবেস থেকে ইউজারের রেফার করা ফ্রেন্ডদের লিস্ট লোড করা
        db.ref('users/' + userId + '/referrals').on('value', snap => {
            let container = document.getElementById('referredListContainer');
            let countBadge = document.getElementById('totalRefCnt');
            let html = "";

            if (snap.exists()) {
                let refUsers = snap.val();
                let keys = Object.keys(refUsers);
                countBadge.innerText = keys.length;

                keys.forEach(key => {
                    let refUser = refUsers[key];
                    let joinDate = refUser.timestamp ? new Date(refUser.timestamp).toLocaleDateString() : 'N/A';
                    
                    html += `
                        <div class="item-box">
                            <div>
                                <b style="color:#fff;"><i class="fa-solid fa-user-check" style="color:#22c55e;"></i> ${refUser.name || 'User'}</b><br>
                                <span style="font-size:10px; color:var(--text-muted);">Joined: ${joinDate}</span>
                            </div>
                            <span style="color: #fbbf24; font-size: 11px; font-weight: bold;">+ Reward</span>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else {
                countBadge.innerText = "0";
                container.innerHTML = `<small style="color: var(--text-muted);">No referred users yet.</small>`;
            }
        });
    </script>
</body>
</html>
